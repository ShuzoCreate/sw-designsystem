:root{
  /* themes/kuat-sienar/DESIGN.md tokens */
  --background:#0A0D0C; --surface:#121815;
  --green:#59E87F; --red:#FF4726;
  --blue:#7FB0FF; --blue-wedge:#3D63C4;
  --white:#EDF2F4; --lavender:#9C8FE8; --amber:#E8A33C;
  --xs:4px;--sm:8px;--md:12px;--lg:20px;--xl:32px;
  --disp:Michroma,Orbitron,Eurostile,sans-serif;
  --num:'Share Tech Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{
  background:var(--background);color:var(--white);
  font-family:var(--disp);text-transform:uppercase;
  min-height:100vh;padding:20px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.deck{width:100%;max-width:1150px;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
h1{font-size:1rem;font-weight:400;letter-spacing:.26em;color:var(--white)}
header .aur{opacity:.9}
header .num{font-family:var(--num);color:var(--amber);text-transform:none;font-size:.72rem}

.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px}

/* station panel: rounded frame + tab notches, one hue each */
.station{position:relative;border:1.5px solid var(--hue);border-radius:14px;padding:14px;background:var(--background)}
.station::before{ /* top tab */
  content:"";position:absolute;top:-1.5px;left:38px;width:64px;height:7px;
  background:var(--background);border:1.5px solid var(--hue);border-top:none;
  border-radius:0 0 7px 7px;
}
.station::after{ /* bottom notch dashes */
  content:"";position:absolute;bottom:-1.5px;right:44px;width:52px;height:1.5px;
  background:var(--background);
  box-shadow:0 0 0 0 transparent;
}
.station .side-aur{position:absolute;left:7px;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;opacity:.85}
.station .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 4px}
.station .head .t{font-size:.58rem;letter-spacing:.26em;color:var(--hue)}
.station .head .num{font-family:var(--num);font-size:.62rem;color:var(--amber);text-transform:none}
canvas{display:block;width:100%;height:auto}

.g{--hue:var(--green)} .b{--hue:var(--blue)} .r{--hue:var(--red)} .w{--hue:var(--white)}

/* red pills + dot grid row */
.pillrow{display:flex;align-items:center;gap:6px;padding:8px 6px 2px}
.pill{height:10px;border-radius:5px;background:var(--red);box-shadow:0 0 10px rgba(255,71,38,.8)}
.dotgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-left:auto}
.dotgrid i{width:4px;height:4px;background:var(--red);opacity:.9}
.dotgrid i.off{opacity:.25}

/* blue trapezoid chips */
.chips{display:flex;gap:8px;align-items:flex-end;padding:8px 4px 0}
.tz{width:56px;height:26px;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);border:1.5px solid var(--blue)}
.tz.fill{background:var(--blue-wedge);border-color:var(--blue)}
.tz.deep{background:var(--blue);opacity:.9}

/* ruler footer */
.ruler{position:relative;height:34px;border-bottom:1px solid var(--white);margin:0 4px}
footer{font-size:.56rem;letter-spacing:.26em;color:#3A423E}
.aur{display:inline-block}
</style>

<script>
(() => {
const C={bg:'#0A0D0C',green:'#59E87F',red:'#FF4726',blue:'#7FB0FF',wedge:'#3D63C4',white:'#EDF2F4',lav:'#9C8FE8',amber:'#E8A33C'};

/* pseudo-aurebesh */
function aurebesh(n,sd,h,color){
  let s2=sd;const r=()=>(s2=(s2*16807)%2147483647)/2147483647;
  const gw=8,gap=4;
  let s=`<svg width="${n*(gw+gap)}" height="${h+2}" viewBox="0 0 ${n*(gw+gap)} ${h+2}" aria-hidden="true">`;
  for(let i=0;i<n;i++){
    const x=i*(gw+gap),k=2+Math.floor(r()*3);
    for(let j=0;j<k;j++){
      const p=[[x,1],[x+gw,1],[x,h],[x+gw,h],[x+gw/2,1],[x+gw/2,h],[x,h/2+1],[x+gw,h/2+1]];
      const a=p[Math.floor(r()*p.length)];let b=p[Math.floor(r()*p.length)];
      if(a===b)b=p[(p.indexOf(a)+3)%p.length];
      s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${color}" stroke-width="1.2" opacity=".9"/>`;
    }
  }
  return s+'</svg>';
}
document.querySelectorAll('.aur').forEach(el=>{
  el.innerHTML=aurebesh(+el.dataset.n||6,+el.dataset.seed||11,+el.dataset.h||10,el.dataset.c||'#EDF2F4');
});

/* ---------- green: ISD side profile + red fill gauge ---------- */
{
const g=document.getElementById('cv-green').getContext('2d');
const W=1080,H=420;
g.lineWidth=2;g.strokeStyle=C.green;g.shadowColor=C.green;g.shadowBlur=4;
function profile(y,h,fillFrac){
  // rounded hull box
  g.beginPath();g.roundRect(150,y,860,h,14);g.stroke();
  // vertical section ribs
  for(let i=1;i<10;i++){const x=150+i*86;g.beginPath();g.moveTo(x,y-14);g.lineTo(x,y+h+14);g.globalAlpha=.55;g.stroke();g.globalAlpha=1}
  // taper line (wedge)
  g.beginPath();g.moveTo(150,y+h);g.lineTo(1010,y+6);g.stroke();
  // bridge tower
  g.beginPath();g.roundRect(96,y+h*0.25,44,h*0.5,4);g.stroke();
  g.beginPath();g.moveTo(118,y+h*0.25);g.lineTo(118,y+h*0.05);g.moveTo(96,y+h*0.05);g.lineTo(140,y+h*0.05);g.stroke();
  if(fillFrac){
    // red wedge fill
    g.save();g.beginPath();g.moveTo(150,y+h);g.lineTo(150+860*fillFrac,y+h);
    g.lineTo(150+860*fillFrac, y+h-(h-8)*fillFrac);g.closePath();
    g.fillStyle='#B23B26';g.shadowColor=C.red;g.shadowBlur=3;g.globalAlpha=.85;g.fill();g.restore();
  }
}
profile(52,110,0.86);
profile(240,110,0);
// small green bracket + blue dial cluster (separate instrument)
g.shadowBlur=0;
function dial(x,y,r,prog){
  g.strokeStyle=C.blue;g.shadowColor=C.blue;g.shadowBlur=5;g.lineWidth=3;
  g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.stroke();
  g.lineWidth=1.6;
  const n=24;
  for(let i=0;i<n*prog;i++){const a=-Math.PI/2+i/n*Math.PI*2;
    g.beginPath();g.moveTo(x+Math.cos(a)*(r+5),y+Math.sin(a)*(r+5));
    g.lineTo(x+Math.cos(a)*(r+12),y+Math.sin(a)*(r+12));g.stroke();}
  g.shadowBlur=0;
}
dial(64,106,20,1);dial(64,294,20,0.35);
g.strokeStyle=C.green;g.lineWidth=2;
[[20,80],[20,268]].forEach(([x,y])=>{
  g.beginPath();g.moveTo(x+8,y);g.lineTo(x,y);g.lineTo(x,y+22);g.lineTo(x+8,y+22);g.stroke();
  g.beginPath();g.moveTo(x+8,y+30);g.lineTo(x,y+30);g.lineTo(x,y+52);g.lineTo(x+8,y+52);g.stroke();
});
}

/* ---------- blue: target range fan ---------- */
{
const b=document.getElementById('cv-blue').getContext('2d');
const W=1080,H=460,ox=210,oy=H*0.52;
// frame area
b.strokeStyle=C.blue;b.lineWidth=1.5;
b.beginPath();b.roundRect(10,14,W-24,H-40,10);b.stroke();
b.save();b.beginPath();b.roundRect(12,16,W-28,H-44,9);b.clip();
// vertical range gridlines + ticks
b.lineWidth=1;
for(let i=0;i<26;i++){
  const x=ox+40+i*32;b.globalAlpha=i%5===0?.8:.35;
  b.beginPath();b.moveTo(x,26);b.lineTo(x,H-38);b.stroke();b.globalAlpha=1;
}
// dashed horizontals
b.setLineDash([3,6]);b.globalAlpha=.7;
[oy-140,oy,oy+140].forEach(y=>{b.beginPath();b.moveTo(24,y);b.lineTo(W-24,y);b.stroke()});
b.setLineDash([]);b.globalAlpha=1;
// translucent wedges
const fans=[[-0.34,-0.22,.5],[-0.2,-0.09,.75],[0.09,0.2,.9],[0.2,0.34,.55],[0.05,0.09,.35]];
fans.forEach(([a0,a1,al])=>{
  b.fillStyle=C.wedge;b.globalAlpha=al*.55;
  b.beginPath();b.moveTo(ox,oy);
  b.lineTo(ox+820*Math.cos(a0),oy+820*Math.sin(a0));
  b.lineTo(ox+820*Math.cos(a1),oy+820*Math.sin(a1));
  b.closePath();b.fill();b.globalAlpha=1;
});
// fan hairlines (blue) + white boundary lines
for(let i=-6;i<=6;i++){
  const a=i*0.058;
  b.strokeStyle=Math.abs(i)===6?C.white:C.blue;
  b.lineWidth=Math.abs(i)===6?1.6:1;
  b.globalAlpha=Math.abs(i)===6?1:.75;
  b.beginPath();b.moveTo(ox,oy);b.lineTo(ox+830*Math.cos(a),oy+830*Math.sin(a));b.stroke();
  b.globalAlpha=1;
}
// white ISD silhouette at vertex (baseline-white exception)
b.strokeStyle=C.white;b.lineWidth=2;b.shadowColor=C.white;b.shadowBlur=4;
b.beginPath();
b.moveTo(ox-8,oy);b.lineTo(ox-52,oy-26);b.lineTo(ox-150,oy-8);b.lineTo(ox-150,oy+8);b.lineTo(ox-52,oy+26);b.closePath();b.stroke();
b.beginPath();b.roundRect(ox-118,oy-6,26,12,3);b.stroke();
b.shadowBlur=0;
// red target marker (single contrast accent)
b.fillStyle=C.red;b.shadowColor=C.red;b.shadowBlur=8;
b.beginPath();b.moveTo(700,oy-10);b.lineTo(708,oy-2);b.lineTo(700,oy+6);b.lineTo(692,oy-2);b.closePath();b.fill();
b.shadowBlur=0;
b.restore();
// right tick column
b.strokeStyle=C.blue;
for(let y=30;y<H-40;y+=12){b.globalAlpha=.6;b.beginPath();b.moveTo(W-20,y);b.lineTo(W-14,y);b.stroke();b.globalAlpha=1}
}

/* ---------- red: battery control ---------- */
{
const r=document.getElementById('cv-red').getContext('2d');
const W=620,H=430,cx=W*0.62,cy=H*0.5;
r.strokeStyle=C.red;r.shadowColor=C.red;
// radial fan of hairlines (two arcs like empire ui)
r.lineWidth=1.2;
for(let i=0;i<34;i++){
  const a=Math.PI*0.62+i*0.052;
  const r0=54,r1=150+((i%2)?26:0);
  r.globalAlpha=.85;r.shadowBlur=3;
  r.beginPath();r.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);
  r.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);r.stroke();
}
// mirrored half-fan on the left, dimmer
for(let i=0;i<26;i++){
  const a=Math.PI*0.62+i*0.052;
  r.globalAlpha=.35;r.shadowBlur=0;
  r.beginPath();r.moveTo(2*70-40+Math.cos(Math.PI-a)*40, cy+Math.sin(Math.PI-a)*40);
  r.lineTo(2*70-40+Math.cos(Math.PI-a)*(120+((i%2)?20:0)), cy+Math.sin(Math.PI-a)*(120+((i%2)?20:0)));r.stroke();
}
// dotted tick arc around the chevrons
for(let i=0;i<40;i++){
  const a=Math.PI*0.55+i*0.05;
  r.globalAlpha=.7;
  r.fillRect(cx+Math.cos(a)*196-1.5,cy+Math.sin(a)*196-1.5,3,3);
}
r.globalAlpha=1;
// hex chevrons
r.lineWidth=6;r.shadowBlur=8;
function chev(s){
  r.beginPath();
  r.moveTo(cx+s*46,cy-s*80);r.lineTo(cx-s*46,cy-s*80*0.35);r.lineTo(cx-s*46,cy+s*80*0.35);r.lineTo(cx+s*46,cy+s*80);
  r.stroke();
}
chev(1);r.lineWidth=3;chev(0.62);
r.shadowBlur=0;
// glowing pill chain across
r.fillStyle=C.red;
let x=70;
const seg=[34,10,22,10,10,26,14,40,10,18,10,30,12];
seg.forEach((w,i)=>{
  r.shadowColor=C.red;r.shadowBlur=10;r.globalAlpha=i%3===2?.5:.95;
  r.beginPath();r.roundRect(x,cy-6,w,12,6);r.fill();x+=w+8;r.globalAlpha=1;
});
r.shadowBlur=0;
// scattered dots + dashes ornament
let sd=41;const rr=()=>(sd=(sd*16807)%2147483647)/2147483647;
for(let i=0;i<26;i++){
  const dx=40+rr()*(W-90),dy=30+rr()*(H-60);
  if(Math.hypot(dx-cx,dy-cy)>170){r.globalAlpha=.8;r.fillRect(dx,dy,3,3);r.globalAlpha=1}
}
// corner mini-bars
r.strokeStyle=C.red;r.lineWidth=1.5;
r.strokeRect(16,16,54,34);r.strokeRect(16,58,32,22);
r.fillRect(20,20,20,8);r.fillRect(44,20,22,8);
}

/* ---------- white: calibration ring dials ---------- */
{
const w=document.getElementById('cv-white').getContext('2d');
const H=300;
function ring(x,y,R,prog,inner){
  const n=64;
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i/n*Math.PI*2;
    const on=i/n<prog;
    w.strokeStyle=on?C.white:'#3A423E';
    w.lineWidth=on?2.4:1.4;
    w.shadowColor=C.white;w.shadowBlur=on?3:0;
    w.beginPath();w.moveTo(x+Math.cos(a)*(R-14),y+Math.sin(a)*(R-14));
    w.lineTo(x+Math.cos(a)*R,y+Math.sin(a)*R);w.stroke();
  }
  w.shadowBlur=0;
  if(inner){
    w.strokeStyle=C.lav;w.lineWidth=1.4;
    w.beginPath();w.arc(x,y,R-24,-Math.PI/2,-Math.PI/2+Math.PI*2*inner);w.stroke();
    w.fillStyle=C.lav;
    const a=-Math.PI/2+Math.PI*2*inner;
    w.beginPath();w.arc(x+Math.cos(a)*(R-24),y+Math.sin(a)*(R-24),3,0,Math.PI*2);w.fill();
  }
}
ring(110,150,84,0.78,0.4);
ring(300,150,58,0.42,0);
ring(452,150,58,0.91,0.66);
// hex fan fragment right
w.strokeStyle=C.white;w.lineWidth=1;
const hx=560,hy=150;
for(let i=0;i<16;i++){
  const a=Math.PI*0.75+i*0.09;
  w.globalAlpha=.6;
  w.beginPath();w.moveTo(hx+Math.cos(a)*24,hy+Math.sin(a)*24);
  w.lineTo(hx+Math.cos(a)*(52+(i%3)*10),hy+Math.sin(a)*(52+(i%3)*10));w.stroke();
  w.globalAlpha=1;
}
}

/* ---------- survey ruler ---------- */
{
const u=document.getElementById('cv-ruler').getContext('2d');
const W=2200;
u.strokeStyle=C.white;u.lineWidth=2;
u.beginPath();u.moveTo(0,52);u.lineTo(W,52);u.stroke();
let sd=7;const rr=()=>(sd=(sd*16807)%2147483647)/2147483647;
let x=20;
while(x<W-20){
  const major=rr()>0.6;
  u.lineWidth=major?2:1.2;
  u.beginPath();u.moveTo(x,52);u.lineTo(x,major?12:32);u.stroke();
  if(major&&rr()>0.5){u.fillStyle=C.red;u.fillRect(x-2,6,4,4);u.fillStyle=C.white}
  x+=14+rr()*70;
}
}
/* dot grid */
{
const dg=document.getElementById('dots');
for(let i=0;i<24;i++){const d=document.createElement('i');if(i%4===3||i>17)d.className='off';dg.appendChild(d)}
}
})();
</script>
