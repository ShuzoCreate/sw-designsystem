:root{
  /* themes/visor/DESIGN.md tokens */
  --mask:#050505;
  --ir-red:#E8352A;
  --ir-red-deep:#4A0805;
  --night-green:#3DDC97;
  --night-blue:#12233F;
  --amber:#B87333;
  --amber-deep:#5C3317;
  --mono-pale:#D8E4E8;
  --full:999px;
  --sm:8px;--md:14px;--lg:24px;
  --f-readout:'Share Tech Mono','JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{
  background:var(--mask);
  color:var(--mono-pale);
  font-family:var(--f-readout);
  min-height:100vh;
  padding:var(--lg) var(--md) var(--md);
  display:flex;flex-direction:column;align-items:center;gap:var(--lg);
}

.stage{display:flex;flex-direction:column;align-items:center;gap:var(--md);width:100%;max-width:1040px}

.viewblock{display:flex;flex-direction:column;align-items:center;gap:var(--sm)}
.cap{
  font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--mono-pale);opacity:.55;
}

/* ============ shared visor glow wrapper ============ */
.glow{position:relative}

/* ============ NIGHT: horizontal oval + temple notch ============ */
.visor-night{
  position:relative;
  width:min(92vw,980px);
  aspect-ratio:2.35/1;
  overflow:hidden;
  clip-path:polygon(
    10% 0%, 90% 0%, 94% 0.6%, 97% 2%, 99% 4.5%, 100% 8%,
    100% 40%, 100% 44%, 88.5% 50%, 100% 56%, 100% 60%,
    100% 92%, 99% 95.5%, 97% 98%, 94% 99.4%, 90% 100%,
    10% 100%, 6% 99.4%, 3% 98%, 1% 95.5%, 0% 92%,
    0% 60%, 0% 56%, 11.5% 50%, 0% 44%, 0% 40%,
    0% 8%, 1% 4.5%, 3% 2%, 6% 0.6%
  );
  background:var(--night-blue);
  filter:drop-shadow(0 0 22px rgba(61,220,151,.16));
}
.visor-night canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.visor-night .layer{position:absolute;inset:0}

/* ============ IR: true circle scope ============ */
.visor-ir{
  position:relative;
  width:min(60vw,440px);
  aspect-ratio:1/1;
  border-radius:var(--full);
  overflow:hidden;
  background:radial-gradient(circle at 50% 46%, #611007 0%, var(--ir-red-deep) 58%, #170201 100%);
  filter:drop-shadow(0 0 20px rgba(232,53,42,.22));
}
.visor-ir .layer{position:absolute;inset:0}

/* ============ grain: scanline + noise + vignette (shared) ============ */
.scanlines{
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.32) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;
  pointer-events:none;
}
.noise{
  opacity:.16;mix-blend-mode:overlay;pointer-events:none;
}
.vignette-night{
  background:radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(5,5,5,.55) 78%, rgba(5,5,5,.92) 100%);
  pointer-events:none;
}
.vignette-ir{
  background:radial-gradient(circle at 50% 50%, transparent 34%, rgba(5,5,5,.5) 74%, rgba(5,5,5,.96) 100%);
  pointer-events:none;
}
@media (prefers-reduced-motion:no-preference){
  .flicker{animation:flicker 3.6s steps(19) infinite}
  @keyframes flicker{
    0%,100%{opacity:1} 4%{opacity:.86} 6%{opacity:1} 41%{opacity:1}
    43%{opacity:.9} 45%{opacity:1} 78%{opacity:1} 80%{opacity:.88} 82%{opacity:1}
  }
}

/* ============ readout typography ============ */
.readout{
  font-family:var(--f-readout);
  font-size:.78rem;font-weight:400;letter-spacing:.12em;line-height:1.25;
  white-space:nowrap;
}
.readout small{font-size:.62rem;opacity:.72;letter-spacing:.18em}
.glowtext-g{color:var(--night-green);text-shadow:0 0 6px rgba(61,220,151,.85),0 0 14px rgba(61,220,151,.35)}
.glowtext-r{color:var(--ir-red);text-shadow:0 0 6px rgba(232,53,42,.9),0 0 15px rgba(232,53,42,.4)}

/* ============ corner readouts (night) ============ */
.corner{position:absolute;display:flex;flex-direction:column;gap:2px}
.corner.tl{top:6%;left:11%;align-items:flex-start}
.corner.tr{top:6%;right:11%;align-items:flex-end;text-align:right}
.corner.bl{bottom:20%;left:9.5%;align-items:flex-start}
.corner.br{bottom:20%;right:9.5%;align-items:flex-end;text-align:right}
.corner .aur{display:block}

.bottomband{
  position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);
  display:flex;align-items:center;gap:12px;
}
.bottomband .aur{display:block}

/* ============ vertical scale bars (night) ============ */
.scalebar{position:absolute;top:20%;bottom:20%;width:14px}
.scalebar.left{left:4.6%}
.scalebar.right{right:4.6%}
.scalebar .ticks{
  position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:repeating-linear-gradient(180deg, var(--night-green) 0 1px, transparent 1px 11px);
  opacity:.85;
}
.scalebar .tick-long{
  position:absolute;left:0;width:100%;height:1px;background:var(--night-green);opacity:.9;
}
.scalebar .ptr{
  position:absolute;left:50%;width:0;height:0;
  border-top:5px solid transparent;border-bottom:5px solid transparent;
}
.scalebar.left .ptr{border-left:7px solid var(--night-green);transform:translate(2px,-50%)}
.scalebar.right .ptr{border-right:7px solid var(--night-green);transform:translate(-9px,-50%)}

/* ============ hex-lock (night) ============ */
.hexlock{position:absolute;top:38%;left:52%;width:15%;aspect-ratio:1/1;transform:translate(-50%,-50%)}

/* ============ reticle (night) ============ */
.reticle-night{position:absolute;inset:0}

/* ============ IR concentric reticle / wireframe ============ */
.svc{position:absolute;inset:0}

footer{
  font-size:.6rem;letter-spacing:.22em;color:var(--mono-pale);opacity:.6;
  text-transform:none;padding-top:var(--sm);
}
.aur{display:inline-block}

<script>
(() => {
/* pseudo-aurebesh glyph runs, per DESIGN.md typography.aurebesh */
function aurebesh(n,sd,h,color){
  const gw=h*0.82, gap=Math.max(3,Math.round(gw*0.4));
  let s2=sd;const r=()=>(s2=(s2*16807)%2147483647)/2147483647;
  let s=`<svg width="${n*(gw+gap)}" height="${h+2}" viewBox="0 0 ${n*(gw+gap)} ${h+2}" aria-hidden="true">`;
  for(let i=0;i<n;i++){
    const x=i*(gw+gap),k=2+Math.floor(r()*3);
    for(let j=0;j<k;j++){
      const pts=[[x,1],[x+gw,1],[x,h],[x+gw,h],[x+gw/2,1],[x+gw/2,h],[x,h/2+1],[x+gw,h/2+1]];
      const a=pts[Math.floor(r()*pts.length)];let b=pts[Math.floor(r()*pts.length)];
      if(a===b)b=pts[(pts.indexOf(a)+3)%pts.length];
      s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${color}" stroke-width="${Math.max(1.1,h/9)}" opacity=".9" stroke-linecap="square"/>`;
    }
  }
  return s+'</svg>';
}
document.querySelectorAll('.aur').forEach(el=>{
  el.innerHTML=aurebesh(+el.dataset.n||4,+el.dataset.seed||11,+el.dataset.h||8,el.dataset.c||'#3DDC97');
});

/* ---- night terrain: canvas silhouette, night-blue duotone only ---- */
(() => {
  const cv=document.getElementById('terrainCanvas');
  const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  const deep='#0A1526', mid='#17335C', pale='#2A4C82';

  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0D1B33');
  sky.addColorStop(.58,'#122542');
  sky.addColorStop(1,deep);
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  /* haze band */
  ctx.fillStyle='rgba(42,76,130,.18)';
  ctx.fillRect(0,H*0.44,W,H*0.14);

  function ridge(baseY, amp, seed, color){
    let s=seed;const r=()=>(s=(s*16807)%2147483647)/2147483647;
    ctx.beginPath();
    ctx.moveTo(0,H);
    ctx.lineTo(0,baseY);
    let x=0,y=baseY;
    while(x<W){
      x+=24+r()*46;
      y=baseY - r()*amp;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,baseY);
    ctx.lineTo(W,H);
    ctx.closePath();
    ctx.fillStyle=color;
    ctx.fill();
  }
  ridge(H*0.62, H*0.10, 91, mid);
  ridge(H*0.70, H*0.14, 733, deep);

  /* distant tower silhouettes */
  function tower(x,baseY,h){
    ctx.strokeStyle=deep;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(x,baseY);ctx.lineTo(x,baseY-h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-9,baseY-h*0.62);ctx.lineTo(x+9,baseY-h*0.62-4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-6,baseY-h*0.3);ctx.lineTo(x+7,baseY-h*0.36);ctx.stroke();
  }
  tower(W*0.72,H*0.66,H*0.24);
  tower(W*0.78,H*0.665,H*0.15);
  tower(W*0.135,H*0.615,H*0.10);

  /* sensor-detected glow points, drawn in the mode's own line-art color */
  function blip(x,y,r){
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(61,220,151,.95)');
    g.addColorStop(1,'rgba(61,220,151,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  blip(W*0.245,H*0.665,10);
  blip(W*0.87,H*0.70,6);
})();

/* ---- shared subtle noise grain, drawn once per view in its own hue ---- */
function grain(id,rgb){
  const cv=document.getElementById(id);
  const ctx=cv.getContext('2d');
  const img=ctx.createImageData(cv.width,cv.height);
  for(let i=0;i<img.data.length;i+=4){
    const v=Math.random()*255;
    img.data[i]=rgb[0];img.data[i+1]=rgb[1];img.data[i+2]=rgb[2];
    img.data[i+3]=v*0.5;
  }
  ctx.putImageData(img,0,0);
}
grain('nightNoise',[61,220,151]);
grain('irNoise',[232,53,42]);
})();
</script>
