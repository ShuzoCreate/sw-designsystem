:root{
  /* themes/holonet-aurek/DESIGN.md tokens */
  --background:#04070D;
  --fill-deep:#0E1B3A;
  --fill-band:#1B2F66;
  --fill-zone:#3A5FB0;
  --stroke:#A9D4FF;
  --text:#D8ECFF;
  --muted:#24406B;
  --gold:#D9A94F;
  --affirm:#3BE86A;
  --xs:3px;--sm:6px;--md:10px;--lg:16px;--xl:26px;
  --disp:Michroma,Orbitron,Eurostile,sans-serif;
  --num:'Share Tech Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{
  background:var(--background);
  color:var(--text);
  font-family:var(--disp);
  text-transform:uppercase;
  min-height:100vh;
  padding:26px 16px;
  display:flex;flex-direction:column;align-items:center;gap:22px;
}

/* ============ nested bezel frame (stroke) ============ */
.bezel{
  position:relative;width:100%;max-width:880px;
  border:2px solid var(--stroke);
  background:var(--fill-deep);
  box-shadow:0 0 26px rgba(58,95,176,.5), inset 0 0 40px rgba(14,27,58,.9);
}
/* accompaniment inner lines */
.bezel .l1,.bezel .l2{content:"";position:absolute;pointer-events:none;border:1px solid var(--stroke);opacity:.75}
.bezel .l1{inset:5px}
.bezel .l2{inset:9px;opacity:.4}
/* corner cells */
.bezel .cell{position:absolute;width:11px;height:11px;border:1px solid var(--stroke);background:var(--fill-band);z-index:3}
.bezel .c-tl{top:-2px;left:-2px}.bezel .c-tr{top:-2px;right:-2px}
.bezel .c-bl{bottom:-2px;left:-2px}.bezel .c-br{bottom:-2px;right:-2px}
.pad{position:relative;z-index:2;padding:15px;display:flex;flex-direction:column;gap:0}

/* ============ bands & zone ============ */
.band{
  background:var(--fill-band);
  border-top:1px solid var(--stroke);
  border-bottom:1px solid var(--stroke);
  padding:14px 22px;
}
.band.head{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.band.head h1{
  font-size:2rem;letter-spacing:.14em;font-weight:400;color:var(--text);
  text-shadow:0 0 16px rgba(169,212,255,.55);
}
.band.head .aurwrap{display:flex;flex-direction:column;gap:3px;padding-bottom:6px}
.band.head .aurwrap .rule{height:2px;background:var(--stroke);opacity:.8}
.band.head .ready{
  margin-left:auto;align-self:center;
  border:1px solid var(--affirm);color:var(--affirm);
  font-size:.6rem;letter-spacing:.26em;padding:5px 14px;
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
}

.zone{
  position:relative;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 30px),
    linear-gradient(180deg, #4368BC, var(--fill-zone) 55%, #31519B);
  margin:14px 6px;
  padding:26px 30px;
  clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px);
  display:flex;align-items:center;gap:34px;
}
.zone::after{ /* inner accompaniment line on the zone */
  content:"";position:absolute;inset:5px;pointer-events:none;
  clip-path:polygon(15px 0,calc(100% - 15px) 0,100% 15px,100% calc(100% - 15px),calc(100% - 15px) 100%,15px 100%,0 calc(100% - 15px),0 15px);
  border:1px solid rgba(216,236,255,.65);
}
.zone .picto{flex:0 0 auto}
.zone .msg{display:flex;flex-direction:column;gap:10px}
.zone .msg .line{display:flex;align-items:center;gap:14px;font-size:.95rem;letter-spacing:.18em;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.4)}
.zone .msg .sub{font-family:var(--num);font-size:.72rem;letter-spacing:.12em;color:var(--text);opacity:.85;text-transform:none}
.arcs span{display:inline-block;color:#fff;font-family:var(--num);font-size:1.1rem}
@media (prefers-reduced-motion:no-preference){
  .arcs span{animation:pulse 1.5s infinite}
  .arcs span:nth-child(2){animation-delay:.25s}
  .arcs span:nth-child(3){animation-delay:.5s}
  @keyframes pulse{0%,100%{opacity:.25}40%{opacity:1}}
}

/* icon row on deep fill */
.iconrow{
  display:flex;gap:10px;justify-content:center;align-items:stretch;
  padding:16px 22px 6px;
}
.icell{
  border:1px solid var(--stroke);
  background:var(--fill-band);
  border-radius:3px;
  padding:7px 12px 5px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  min-width:74px;
}
.icell svg{display:block;stroke:var(--stroke);fill:none;stroke-width:1.6}
.icell .cap{opacity:.85}
.iconrow-rule{height:1px;background:var(--muted);margin:12px 40px 0}

.band.foot{
  border-bottom:none;border-top:1px solid var(--muted);
  background:transparent;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:12px 22px 4px;
}
.band.foot .num{font-family:var(--num);font-size:.66rem;color:var(--muted);text-transform:none;letter-spacing:.12em}

/* ============ visor variant (gold frame) ============ */
.visor{
  position:relative;width:100%;max-width:880px;
  border:2px solid var(--gold);
  background:
    repeating-linear-gradient(0deg, rgba(217,169,79,.14) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(90deg, rgba(217,169,79,.14) 0 1px, transparent 1px 9px),
    #120E08;
  box-shadow:0 0 22px rgba(217,169,79,.35);
  padding:18px;
}
.visor .l1{position:absolute;inset:5px;border:1px solid var(--gold);opacity:.7;pointer-events:none}
.visor .l2{position:absolute;inset:9px;border:1px solid var(--gold);opacity:.35;pointer-events:none}
.visor .cell{position:absolute;width:10px;height:10px;border:1px solid var(--gold);background:#120E08;z-index:3}
.visor .c-tl{top:-2px;left:-2px}.visor .c-tr{top:-2px;right:-2px}
.visor .c-bl{bottom:-2px;left:-2px}.visor .c-br{bottom:-2px;right:-2px}
.visor-in{position:relative;display:flex;align-items:center;gap:16px}
.vtab{
  flex:0 0 auto;background:var(--fill-zone);border:1px solid var(--stroke);
  padding:6px 8px;font-size:.55rem;letter-spacing:.2em;color:var(--text);
}
.vscreen{
  flex:1;position:relative;
  background:linear-gradient(180deg,#4A73C9,var(--fill-zone) 60%,#2F4E96);
  clip-path:polygon(26px 0,calc(100% - 26px) 0,100% 50%,calc(100% - 26px) 100%,26px 100%,0 50%);
  padding:20px 44px;
  display:grid;place-items:center;
  box-shadow:inset 0 0 24px rgba(255,255,255,.15);
}
.vscreen .aur{filter:drop-shadow(0 0 6px rgba(255,255,255,.7))}
.vside{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
.vside i{display:block;width:14px;height:5px;background:var(--gold);opacity:.85}
.vside i:nth-child(2n){opacity:.4}
.vfoot{
  position:relative;margin-top:12px;border:1px solid var(--gold);opacity:.9;
  display:flex;justify-content:space-between;align-items:center;
  padding:4px 12px;font-family:var(--num);font-size:.6rem;color:var(--gold);text-transform:none;
}
.vlabel{position:absolute;top:-8px;right:26px;background:#120E08;color:var(--gold);font-size:.55rem;letter-spacing:.24em;padding:0 10px}

footer{font-size:.56rem;letter-spacing:.24em;color:var(--muted)}
.aur{display:inline-block}

<script>
(() => {
/* pseudo-aurebesh glyph runs */
function aurebesh(n,sd,h,gw,color){
  let s2=sd;const r=()=>(s2=(s2*16807)%2147483647)/2147483647;
  const gap=Math.max(3,Math.round(gw*0.45));
  let s=`<svg width="${n*(gw+gap)}" height="${h+2}" viewBox="0 0 ${n*(gw+gap)} ${h+2}" aria-hidden="true">`;
  for(let i=0;i<n;i++){
    const x=i*(gw+gap),k=2+Math.floor(r()*3);
    for(let j=0;j<k;j++){
      const pts=[[x,1],[x+gw,1],[x,h],[x+gw,h],[x+gw/2,1],[x+gw/2,h],[x,h/2+1],[x+gw,h/2+1]];
      const a=pts[Math.floor(r()*pts.length)];let b=pts[Math.floor(r()*pts.length)];
      if(a===b)b=pts[(pts.indexOf(a)+3)%pts.length];
      s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${color}" stroke-width="${Math.max(1.3,h/9)}" opacity=".92" stroke-linecap="square"/>`;
    }
  }
  return s+'</svg>';
}
document.querySelectorAll('.aur').forEach(el=>{
  el.innerHTML=aurebesh(+el.dataset.n||6,+el.dataset.seed||11,+el.dataset.h||11,+el.dataset.w||9,el.dataset.c||'#A9D4FF');
});

    <line x1="90" y1="70" x2="130" y2="70" opacity=".8"/>
  </g>
</svg>`;

/* icon row: outline pictogram cells with aurebesh captions */
const GLYPHS={
  fighter:'<path d="M14 4 L17 12 L24 14 L17 16 L14 24 L11 16 L4 14 L11 12 Z"/>',
  droid:'<circle cx="14" cy="11" r="6"/><path d="M8 17 h12 v6 h-12 z"/><line x1="14" y1="5" x2="14" y2="2"/>',
  chip:'<rect x="5" y="8" width="18" height="13" rx="2"/><rect x="9" y="12" width="5" height="5"/><line x1="17" y1="12" x2="21" y2="12"/><line x1="17" y1="16" x2="21" y2="16"/>',
  comm:'<circle cx="14" cy="17" r="2.4"/><path d="M9.5 14 a6.5 6.5 0 0 1 9 0 M6.5 10.5 a10.5 10.5 0 0 1 15 0"/>',
  holo:'<path d="M8 22 h12 M11 22 L9 13 h10 l-2 9"/><path d="M10 10 L14 3 L18 10" opacity=".8"/>',
  cred:'<circle cx="14" cy="14" r="9"/><path d="M14 8 v12 M10.5 11 h7 M10.5 17 h7"/>'
};
const row=document.getElementById('iconrow');
Object.entries(GLYPHS).forEach(([k,g],i)=>{
  const cell=document.createElement('div');cell.className='icell';
  cell.innerHTML=`<svg width="26" height="26" viewBox="0 0 28 26">${g}</svg><span class="cap">${aurebesh(3+(i%3),60+i*17,7,7,'#A9D4FF')}</span>`;
  row.appendChild(cell);
});
})();
</script>
