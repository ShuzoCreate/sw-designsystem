:root{
  /* themes/vectorscope/DESIGN.md tokens */
  --background:#060605;
  --bezel:#191917;
  --ph-green:#43FF64;
  --ph-amber:#FFA028;
  --ph-red:#FF2D2D;
  --ph-blue:#3E6DFF;
  --ph-magenta:#FF4F9E;
  --ph-white:#EDEDE2;
  --sp-sm:8px;--sp-md:16px;--sp-lg:28px;--sp-xl:48px;
  --font:'VT323','Share Tech Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{
  background:var(--background);
  font-family:var(--font);
  color:var(--ph-white);
  min-height:100vh;
  padding:var(--sp-xl) var(--sp-lg);
  display:flex;flex-direction:column;align-items:center;gap:var(--sp-lg);
}
.bank{display:flex;flex-wrap:wrap;gap:var(--sp-lg);justify-content:center;align-items:flex-start;max-width:1100px}

/* ---- crt-viewport: thick bezel, big rounded corners ---- */
.crt{
  background:var(--bezel);
  border-radius:38px;
  padding:14px;
  box-shadow:inset 0 2px 6px rgba(255,255,255,.06), inset 0 -3px 8px rgba(0,0,0,.8), 0 6px 22px rgba(0,0,0,.7);
}
.crt .tube{
  position:relative;
  background:var(--background);
  border-radius:28px;
  overflow:hidden;
}
.crt canvas{display:block}
/* faint scanlines */
.tube::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 4px);
  border-radius:28px;
}
/* circular scope variant */
.crt.scope, .crt.scope .tube{border-radius:999px}
.crt.scope .tube::after{border-radius:999px}

.unit{display:flex;flex-direction:column;gap:var(--sp-sm);align-items:center}
.unit .tag{
  font-size:1.05rem;letter-spacing:.2em;color:var(--ph-white);opacity:.42;text-transform:uppercase;
}

/* readout digits under targeting crt */
.readout{
  display:flex;gap:var(--sp-md);align-items:center;justify-content:center;
  font-size:2.1rem;letter-spacing:.14em;color:var(--ph-amber);
  text-shadow:0 0 12px var(--ph-amber);
}
.readout .ring{
  display:inline-flex;align-items:center;justify-content:center;
  width:1.7em;height:1.7em;border:3px solid var(--ph-red);border-radius:999px;
  color:var(--ph-red);text-shadow:0 0 12px var(--ph-red);
}
footer{font-size:1rem;letter-spacing:.2em;color:var(--ph-white);opacity:.3;text-transform:uppercase}
</style>

<div class="bank">
  <!-- targeting computer (amber + red) -->
  <div class="unit">
    <div class="crt"><div class="tube"><canvas id="target" width="520" height="380"></canvas></div></div>
    <div class="readout"><span class="ring">◉</span><span id="range">2523</span></div>
    <div class="tag">targeting</div>
  </div>

  <!-- circular scope (blue + magenta) -->
  <div class="unit">
    <div class="crt scope"><div class="tube"><canvas id="scope" width="360" height="360"></canvas></div></div>
    <div class="tag">sensor</div>
  </div>

  <!-- schematic (green) -->
  <div class="unit">
    <div class="crt"><div class="tube"><canvas id="schem" width="440" height="300"></canvas></div></div>
    <div class="tag">systems</div>
  </div>

  <!-- tactical sphere (white dot-matrix) -->
  <div class="unit">
    <div class="crt"><div class="tube"><canvas id="tact" width="360" height="300"></canvas></div></div>
    <div class="tag">tactical</div>
  </div>
</div>

<footer>themes/vectorscope/DESIGN.md verification sample — tokens only</footer>

<script>
(() => {
const C={bg:'#060605',green:'#43FF64',amber:'#FFA028',red:'#FF2D2D',blue:'#3E6DFF',magenta:'#FF4F9E',white:'#EDEDE2'};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function glow(ctx,color,blur){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=blur}

/* ---- targeting computer: converging trench grid, amber, red crosshair ---- */
const t=document.getElementById('target').getContext('2d');
{
const W=520,H=380,cx=W/2,cy=H/2;
function rr(x,y,w,h,r){t.beginPath();t.moveTo(x+r,y);t.arcTo(x+w,y,x+w,y+h,r);t.arcTo(x+w,y+h,x,y+h,r);t.arcTo(x,y+h,x,y,r);t.arcTo(x,y,x+w,y,r);t.closePath()}
t.lineWidth=3;glow(t,C.amber,10);
// rounded CRT frame, doubled like the film's targeting bezel
rr(26,22,W-52,H-44,34);t.stroke();
t.lineWidth=1.6;rr(36,32,W-72,H-64,26);t.stroke();
// converging trench lines from frame corners & edge midpoints
const vx=cx,vy=cy+4;
for(const [x,y] of [[46,42],[W-46,42],[46,H-42],[W-46,H-42],[36,cy],[W-36,cy],[cx-90,32],[cx+90,32],[cx-90,H-32],[cx+90,H-32]]){
  t.lineWidth=2;t.beginPath();t.moveTo(x,y);
  t.lineTo(x+(vx-x)*0.62,y+(vy-y)*0.62);t.stroke();
}
// inner receding rounded rectangles
for(let k=1;k<=3;k++){
  const f=1-k*0.21;t.lineWidth=k===3?3:2;
  rr(cx-(cx-36)*f,cy-(cy-52)*f,(cx-36)*2*f,(cy-52)*2*f,20*f);t.stroke();
}
// red crosshair
glow(t,C.red,12);t.lineWidth=3;
t.beginPath();t.moveTo(cx-70,cy);t.lineTo(cx-16,cy);t.moveTo(cx+16,cy);t.lineTo(cx+70,cy);
t.moveTo(cx,cy-56);t.lineTo(cx,cy-12);t.moveTo(cx,cy+12);t.lineTo(cx,cy+56);t.stroke();
t.beginPath();t.arc(cx,cy,8,0,Math.PI*2);t.stroke();
}

/* ---- circular scope: blue tick fan + magenta blob ---- */
const s=document.getElementById('scope').getContext('2d');
{
const W=360,cx=W/2,cy=W/2,R=W/2-10;
glow(s,C.blue,8);
// tick fans top & bottom, length varies like a spectrum
for(let i=-34;i<=34;i++){
  const a=-Math.PI/2+i*0.024;
  const L=6+18*Math.exp(-(i*i)/180)+(i%5===0?8:0);
  for(const flip of [1,-1]){
    const a2=flip===1?a:a+Math.PI;
    s.lineWidth=2;s.beginPath();
    s.moveTo(cx+Math.cos(a2)*(R-4),cy+Math.sin(a2)*(R-4));
    s.lineTo(cx+Math.cos(a2)*(R-4-L),cy+Math.sin(a2)*(R-4-L));s.stroke();
  }
}
// side dashes
for(const side of [0,Math.PI]){
  for(let j=0;j<3;j++){
    s.beginPath();s.moveTo(cx+Math.cos(side)*(R-14-j*9),cy-8+0);s.lineTo(cx+Math.cos(side)*(R-14-j*9),cy+8);s.stroke();
  }
}
// center vertical hair
s.lineWidth=2;s.beginPath();s.moveTo(cx,cy-R*0.55);s.lineTo(cx,cy-R*0.1);s.moveTo(cx,cy+R*0.1);s.lineTo(cx,cy+R*0.55);s.stroke();
// magenta contact blob (jagged cluster, dot-matrix-ish)
glow(s,C.magenta,14);
let seed=66;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<260;i++){
  const bx=cx-40+rnd()*95, by=cy+34+rnd()*46;
  const d=Math.hypot(bx-(cx+8),by-(cy+56));
  if(d<52+rnd()*14){s.fillRect(bx,by,2.6,2.6)}
}
}

/* ---- schematic: green circuit wireframe ---- */
const g=document.getElementById('schem').getContext('2d');
{
const W=440,H=300;let seed=1977;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
glow(g,C.green,7);g.lineWidth=1.6;
g.strokeRect(18,18,W-36,H-36);
// blocky circuit clusters
for(let i=0;i<46;i++){
  const x=26+rnd()*(W-80),y=26+rnd()*(H-80),w=8+rnd()*54,h=6+rnd()*26;
  if(rnd()>0.35){g.strokeRect(x,y,w,h)}
  else{g.beginPath();g.moveTo(x,y);g.lineTo(x+w,y);g.lineTo(x+w,y+h);g.stroke()}
  if(rnd()>0.6){g.fillRect(x+2,y+2,3,3)}
}
// bus lines
for(let i=0;i<5;i++){
  const y=40+i*52;g.lineWidth=2.4;g.beginPath();g.moveTo(24,y);g.lineTo(W-24,y);g.stroke();g.lineWidth=1.6;
}
}

/* ---- tactical: white dot-matrix sphere ---- */
const d=document.getElementById('tact').getContext('2d');
{
const W=360,H=300,cx=W/2,cy=H/2,R=102;
glow(d,C.white,6);
// dotted sphere (death-star-ish): dense lat/lon dot shell
for(let la=-8;la<=8;la++){
  const phi=la*Math.PI/18,y=cy+Math.sin(phi)*R,r=Math.cos(phi)*R;
  const n=Math.max(8,Math.floor(r/2.6));
  for(let k=0;k<n;k++){
    const th=(k/n)*Math.PI*2;
    const x=cx+Math.cos(th)*r*0.99;
    d.fillRect(x,y,2.2,2.2);
  }
}
// meridian dot arcs for volume
for(let lo=0;lo<6;lo++){
  const sq=Math.cos(lo*Math.PI/6);
  for(let k=0;k<46;k++){
    const th=k/46*Math.PI*2;
    d.fillRect(cx+Math.cos(th)*R*Math.abs(sq),cy+Math.sin(th)*R,1.8,1.8);
  }
}
// dish circle on upper-left limb
for(let k=0;k<46;k++){const th=k/46*Math.PI*2;d.fillRect(cx-R*0.42+Math.cos(th)*24,cy-R*0.38+Math.sin(th)*24,2.2,2.2)}
// star specks
let seed=1138;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<70;i++){const x=rnd()*W,y=rnd()*H;if(Math.hypot(x-cx,y-cy)>R+14)d.fillRect(x,y,1.6,1.6)}
}

/* range count-down flicker */
const range=document.getElementById('range');
if(!reduced){
  let v=2523;
  setInterval(()=>{v=v>320?v-Math.floor(1+Math.random()*7):2523;range.textContent=String(v).padStart(4,'0')},180);
}
})();
</script>
