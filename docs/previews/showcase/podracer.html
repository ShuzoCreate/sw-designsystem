:root{
  /* themes/podracer/DESIGN.md tokens */
  --housing:#5C4A3A;
  --dust:#8A7B68;
  --dark:#2B241D;
  --amber:#F2A93C;
  --cyan:#4FBFDB;
  --magenta:#E0439A;
  --green:#4CD97A;
  --red:#E04A2B;
  --bezel:999px;
  --panel:10px;
  --sm:6px;--md:12px;--lg:20px;
  --readout:'VT323','Share Tech Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{color-scheme:dark}
body{
  background:var(--dark);
  min-height:100vh;
  padding:34px 20px 26px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  font-family:var(--readout);
}

/* ============ weathered wall ============ */
.wall{
  position:relative;
  width:1160px;height:722px;
  background:
    radial-gradient(ellipse 340px 260px at 14% 10%, rgba(255,255,255,.06), transparent 60%),
    radial-gradient(ellipse 200px 160px at 88% 8%, rgba(0,0,0,.35), transparent 65%),
    radial-gradient(ellipse 260px 220px at 92% 92%, rgba(0,0,0,.4), transparent 60%),
    radial-gradient(circle 90px at 22% 68%, rgba(90,55,30,.45), transparent 70%),
    radial-gradient(circle 130px at 70% 40%, rgba(40,25,15,.35), transparent 72%),
    radial-gradient(circle 60px at 48% 88%, rgba(100,70,40,.4), transparent 70%),
    radial-gradient(circle 70px at 6% 85%, rgba(20,15,10,.5), transparent 65%),
    linear-gradient(152deg, var(--dust) 0%, var(--housing) 46%, #493A2C 70%, var(--dark) 100%);
  box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 120px rgba(0,0,0,.55);
  overflow:hidden;
}
.wall::before{
  /* dust/grain texture */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
}
.wall::after{
  /* scratches */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
  background:
    repeating-linear-gradient(78deg, rgba(255,255,255,.5) 0 1px, transparent 1px 140px),
    repeating-linear-gradient(15deg, rgba(0,0,0,.5) 0 1px, transparent 1px 190px),
    repeating-linear-gradient(-32deg, rgba(255,255,255,.3) 0 1px, transparent 1px 260px);
}

/* ============ shared: mount plate under every instrument ============ */
.inst{position:absolute;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55));}
.inst::before{ /* grime halo where bolted to wall */
  content:"";position:absolute;inset:-14px;z-index:-1;border-radius:inherit;

/* ---- hand-carved pseudo-aurebesh: jittered points, uneven strokes ---- */
function aurebesh(n, sd, h, gw, color, jitter) {
  let s2 = sd;
  const r = () => (s2 = (s2 * 16807) % 2147483647) / 2147483647;
  jitter = jitter || 1.2;
  const gap = Math.max(3, Math.round(gw * (0.4 + r() * 0.2)));
  const totalW = n * (gw + gap) + jitter * 6;
  const totalH = h + jitter * 6;
  let s = `<svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" aria-hidden="true">`;
  let x = jitter * 3;
  for (let i = 0; i < n; i++) {
    const localH = h * (0.78 + r() * 0.4);
    const localW = gw * (0.82 + r() * 0.32);
    const by = jitter * 3 + (h - localH) * r() * 0.6;
    const k = 2 + Math.floor(r() * 3);
    const jig = () => (r() - 0.5) * jitter * 2.2;
    const pts = [
      [x + jig(), by + jig()],
      [x + localW + jig(), by + jig()],
      [x + jig(), by + localH + jig()],
      [x + localW + jig(), by + localH + jig()],
      [x + localW / 2 + jig(), by + jig()],
      [x + localW / 2 + jig(), by + localH + jig()],
      [x + jig(), by + localH / 2 + jig()],
      [x + localW + jig(), by + localH / 2 + jig()],
    ];
    for (let j = 0; j < k; j++) {
      const a = pts[Math.floor(r() * pts.length)];
      let b = pts[Math.floor(r() * pts.length)];
      if (a === b) b = pts[(pts.indexOf(a) + 3) % pts.length];
      const sw = Math.max(1, (h / 9) * (0.7 + r() * 0.6));
      s += `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${color}" stroke-width="${sw.toFixed(2)}" opacity="${(0.72 + r() * 0.24).toFixed(2)}" stroke-linecap="round"/>`;
    }
    x += localW + gap;
  }
  return s + "</svg>";
}

    el.dataset.c || "#F2A93C",
    +el.dataset.jit || 1.2

/* ---- seeded PRNG helper ---- */
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---- weathered analog gauge on canvas ---- */
function drawGauge(canvas, opts) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = opts.teardrop ? h * 0.44 : h / 2;
  const r = Math.min(w, h * (opts.teardrop ? 0.66 : 1)) / 2 - 6;
  const rnd = mulberry(+canvas.dataset.seed || 1);
  ctx.clearRect(0, 0, w, h);

  // face
  const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, r);
  grad.addColorStop(0, "#241a10");
  grad.addColorStop(0.55, "#150e08");
  grad.addColorStop(1, "#0a0603");
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

  // accent glow arc
  ctx.save();
  ctx.shadowColor = opts.accent;
  ctx.shadowBlur = 12;
  ctx.strokeStyle = opts.accent;
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.arc(cx, cy, r - 9, Math.PI * 0.72, Math.PI * 2.28);
  ctx.stroke();
  ctx.restore();

  // ticks — irregular, some worn away
  const nTicks = opts.ticks || 22;
  for (let i = 0; i <= nTicks; i++) {
    if (rnd() < 0.12) continue; // missing/worn tick
    const a = Math.PI * 0.72 + (i / nTicks) * Math.PI * 1.56;
    const long = i % 4 === 0;
    const len = (long ? 11 : 6) * (0.7 + rnd() * 0.5);
    const rOuter = r - 5;
    const rInner = rOuter - len;
    const x1 = cx + Math.cos(a) * rOuter, y1 = cy + Math.sin(a) * rOuter;
    const x2 = cx + Math.cos(a) * rInner, y2 = cy + Math.sin(a) * rInner;
    ctx.strokeStyle = long ? opts.main : "rgba(197,168,120,.55)";
    ctx.lineWidth = long ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  // a couple worn numerals
  ctx.fillStyle = "rgba(230,200,150,.8)";
  ctx.font = `${Math.round(r * 0.22)}px VT323, monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  [0, 0.5, 1].forEach((f, i) => {
    const a = Math.PI * 0.72 + f * Math.PI * 1.56;
    const rx = cx + Math.cos(a) * (r - (18 + rnd() * 4));
    const ry = cy + Math.sin(a) * (r - (18 + rnd() * 4));
    ctx.save();
    ctx.translate(rx, ry);
    ctx.rotate((rnd() - 0.5) * 0.3);
    ctx.fillText(["0", "5", "9"][i], 0, 0);
    ctx.restore();
  });

  // needle
  const angle = Math.PI * 0.72 + (0.25 + rnd() * 0.55) * Math.PI * 1.56;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.shadowColor = opts.main;
  ctx.shadowBlur = 8;
  ctx.fillStyle = opts.main;
  ctx.beginPath();
  ctx.moveTo(-3, 0);
  ctx.lineTo(0, -(r - 14));
  ctx.lineTo(3, 0);
  ctx.lineTo(0, 8);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // center pin
  const pin = ctx.createRadialGradient(cx - 2, cy - 2, 0, cx, cy, 7);
  pin.addColorStop(0, "#e8d6ad");
  pin.addColorStop(1, "#4a3a24");
  ctx.fillStyle = pin;
  ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();

  // smudge fingerprint
  ctx.save();
  ctx.globalAlpha = 0.1;
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.ellipse(cx + r * 0.3, cy - r * 0.35, r * 0.32, r * 0.18, 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
